.nav-crumb a:hover{color:var(--acc)}

.nav-secs::-webkit-scrollbar{display:none}
.nav-secs button{flex:0 0 auto;font:600 15px/1 var(--sans);padding:0 8px;margin-right:8px;border:0;background:none;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;border-radius:0;display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;box-sizing:border-box}

.nav-secs button.on{color:var(--ink);border-bottom-color:var(--acc)}
.nav-secs button.spy{color:var(--ink)}

.nav-crumb[hidden],.nav-cut[hidden]{display:none!important}
.nav-cut button{font:600 11px/1 var(--sans);letter-spacing:.03em;padding:0 10px;border:1px solid var(--line);background:transparent;color:var(--mut);cursor:pointer;margin:0 0 0 -1px;min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box}
.nav-cut button:first-child{margin-left:0;border-radius:3px 0 0 3px}
.nav-cut button:last-child{border-radius:0 3px 3px 0}
.nav-cut button.on{background:var(--ink);color:var(--paper);border-color:var(--ink);position:relative;z-index:1}
.nav-cut[hidden]{display:none}
section,.row,.sub,.ch{scroll-margin-top:calc(var(--pin-h) + 12px)}
.kicker{display:inline-block;margin:0 0 6px;font:600 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink);text-decoration:none}
.kicker:hover{color:var(--acc)}
.mast-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:nowrap}
.mast-row>div{min-width:0;flex:1}
header h1{margin:0;font:650 2.05rem/1.1 var(--serif);letter-spacing:-.02em}
.ed{margin:5px 0 0;color:var(--mut);font-size:14px;letter-spacing:.01em}
#send{flex:0 0 auto;border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:0;padding:0 12px;cursor:pointer;font:600 11.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
#send:hover{background:var(--ink);color:var(--paper)}
main{max-width:900px;margin:0 auto;padding:16px 20px max(72px,calc(72px + env(safe-area-inset-bottom,0px)))}
section{background:transparent;border:0;border-radius:0;margin:1.8rem 0 0;overflow:visible}
.view>section:first-child{margin-top:.4rem}
.ch{display:flex;align-items:baseline;gap:10px;padding:0 0 10px;cursor:pointer;user-select:none;border-bottom:2px solid var(--rule)}
.ch h2{margin:0;font:650 1.45rem/1.15 var(--serif);flex:1;letter-spacing:-.015em}
.car{transition:transform .2s;color:var(--mut);font-size:13px;line-height:1}
section.closed .car{transform:rotate(-90deg)}
section.closed .body{display:none}
section.closed .ch{border-bottom-width:1px;border-bottom-color:var(--line)}
.top{padding:14px 0 4px}
.top h4{margin:0 0 8px;font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.top ol{margin:0;padding-left:1.15rem;font-size:15px}
.top li{min-height:44px;padding:8px 0;box-sizing:border-box}
.top a{color:var(--ink);text-decoration:none;font-family:var(--serif);font-weight:550}
.top a:hover{color:var(--acc)}
.sh{display:flex;align-items:center;gap:8px;padding:18px 0 2px}
.sh span.t{flex:1;font:600 11.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.row{display:flex;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.sh+.row{border-top:0;padding-top:10px}
.th,.ph{flex:0 0 120px;flex-shrink:0;align-self:flex-start;width:120px;aspect-ratio:3/2;height:auto;border-radius:2px;object-fit:cover;background:var(--wash)}
.ph{display:flex;align-items:center;justify-content:center;color:#9a968e;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.tx{flex:1;min-width:0}
.tx b{display:block;font:600 1.12rem/1.28 var(--serif);letter-spacing:-.01em}
.tx .n{color:var(--mut);font-weight:500;margin-right:.4em;font-variant-numeric:tabular-nums;font-family:var(--sans);font-size:.86em}
.tx p{margin:4px 0 0;color:#3a3834;font-size:15px;line-height:1.45}
.tx a{color:var(--acc);font-size:13px;font-weight:600;letter-spacing:.02em;text-decoration:none}
.tx a:hover{text-decoration:underline}
.dt{color:var(--mut);font-size:13px}
.more{display:none}
.sub.open .more{display:flex}
.mt{margin:2px 0 8px;border:0;background:none;color:var(--mut);cursor:pointer;font:600 13px/1.4 var(--sans);padding:0;letter-spacing:.02em;min-height:44px;display:inline-flex;align-items:center}
.mt:hover{color:var(--acc)}
.v{display:flex;flex-direction:column;gap:0;align-items:center;flex:0 0 auto;margin-left:4px}
.v button{border:0;background:transparent;border-radius:3px;cursor:pointer;font-size:14px;padding:0;opacity:.4;line-height:1;color:var(--ink);min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box}

.v button.on{opacity:1}
.v button.on.up{background:#e7f1ea;color:var(--up)}

.ch .v,.sh .v{flex-direction:row;align-items:center}
.ch .v button{font-size:14px}

  .nav-secs{padding:0 14px}
  main{padding-left:14px;padding-right:14px}

  .nav-util a{margin-right:12px}
  .nav-secs button{margin-right:12px;font-size:14px}
  .pin.scrolled .kicker,.pin.scrolled .ed{display:none}

  .pin.scrolled .mast{padding:2px 0 4px}

@media(max-width:430px){

  .th,.ph{flex:0 0 72px;width:72px}
}

}

  .nav-cut{display:flex;justify-content:flex-start;border-bottom:0;padding:0 0 14px;margin:0}
  .nav-secs{display:flex;flex-direction:column;align-items:stretch;overflow:visible;flex-wrap:nowrap;border-bottom:0;margin:0;padding:0;gap:0}
  .nav-secs button{width:100%;margin:0;padding:0 12px;justify-content:flex-start;text-align:left;white-space:normal;border-bottom:0;border-left:2px solid transparent;border-radius:0;min-height:44px;min-width:44px}

  main{grid-area:main;max-width:none;margin:0;padding:16px 20px max(72px,calc(32px + env(safe-area-inset-bottom,0px))) 24px;container-type:inline-size;container-name:stories}

  .th,.ph{flex:0 0 100px;width:100px}
}
@container stories (min-width:560px){
  .sub{display:grid;grid-template-columns:1fr 1fr;column-gap:20px;align-items:start}

@media(prefers-color-scheme:dark){

  .v button.on.ne{background:var(--wash);color:var(--ne)}
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderCats(DATA,V){let h='';
for(const c of DATA){const cid=slug(c.cat);
 const top=[];for(let r=0;top.length<5&&r<10;r++)for(const s of c.subs){if(s.items[r]&&top.length<5)top.push(s.items[r])}
 h+=`<section id="${V}-${cid}"><div class="ch"><span class="car">▾</span><h2>${esc(c.cat)}</h2>${votes('category',cid,c.cat)}</div><div class="body">`;
 if(!(c.subs.length===1&&!c.subs[0].sub))h+=`<div class="top"><h4>Top 5</h4><ol>${top.map(it=>`<li><a href="#${V}-s${it[7]}">${esc(it[1])}</a></li>`).join('')}</ol></div>`;
 for(const s of c.subs){if(!s.items.length)continue;const sid=cid+'/'+slug(s.sub);
  h+=`<div class="sub"${s.sub?` id="${V}-${cid}-${slug(s.sub)}"`:''}>`+(s.sub?`<div class="sh"><span class="t">${esc(s.sub)}</span>${votes('subcategory',sid,c.cat+' › '+s.sub)}</div>`:'');
  s.items.slice(0,10).forEach((it,i)=>h+=row(it,i>=5?'more':'',V,c.cat+(s.sub?' › '+s.sub:'')));
  if(s.items.length>5)h+=`<button class="mt">…more (${Math.min(10,s.items.length)-5})</button>`;
  h+=`</div>`;}
 h+=`</div></section>`;}
return h}
let VIEWS=Array.isArray(DATA)?[['all','',DATA]]:DATA.views;

const key=(l,i)=>`fb:${FEED}:${DATE}:${l}:${i}`;
const LK='likes:v1',UK='likes:unliked',lget=k=>{try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return {}}},lset=(k,o)=>localStorage.setItem(k,JSON.stringify(o));
function likeSync(v,on){if(v.dataset.level!=='story')return;const L=lget(LK),U=lget(UK),d=v.dataset,id=d.id;
 if(on){if(!L[id])L[id]={id,title:d.title,url:d.url,img:d.img,desc:d.desc,source:d.src,date:DATE,dt:d.dt,feed:FEED,feedname:FEEDNAME,cat:d.cat,ts:Date.now()};delete U[id]}
 else{delete L[id];U[id]=Date.now()}
 lset(LK,L);lset(UK,U)}
document.querySelectorAll('.v').forEach(v=>{const {level,id,title}=v.dataset;const st=localStorage.getItem(key(level,id));
 if(st)v.querySelectorAll(`[data-d="${st}"]`).forEach(b=>b.classList.add('on'));
 if(st==='up'&&level==='story'&&!lget(LK)[id])likeSync(v,true);
 v.querySelectorAll('button').forEach(b=>b.addEventListener('click',async ev=>{ev.stopPropagation();
  const was=b.classList.contains('on');const vote=was?'clear':b.dataset.d;
  document.querySelectorAll(`.v[data-level="${level}"][data-id="${id}"]`).forEach(w=>w.querySelectorAll('button').forEach(x=>x.classList.toggle('on',!was&&x.dataset.d===vote)));
  was?localStorage.removeItem(key(level,id)):localStorage.setItem(key(level,id),vote);
  if(level==='story')likeSync(v,vote==='up');

 document.querySelectorAll('.v').forEach(v=>{const k=key(v.dataset.level,v.dataset.id);if(seen.has(k))return;seen.add(k);const s=localStorage.getItem(k);if(s)lines.push(`${icon[s]} ${s} | ${v.dataset.level} ${v.dataset.id}: ${v.dataset.title}`)});

 const body=`feed: ${FEEDNAME}\ndate: ${DATE}\n\n`+lines.join('\n');

/* ---- two-level pinned nav ---- */
const defaultCut=VIEWS[0][0];
let cut=defaultCut,sec='',sub='';
let lastSpy='';
const cats=()=>(VIEWS.find(v=>v[0]===cut)||VIEWS[0])[2];
const catBySlug=s=>cats().find(c=>slug(c.cat)===s);
const namedSubs=c=>(c?c.subs:[]).filter(s=>s.sub&&s.items.length);
const UNFOLD='(min-width:600px) and (min-height:520px) and (min-aspect-ratio:3/4)';
function setPinH(){const unfolded=window.matchMedia(UNFOLD).matches;const el=document.getElementById(unfolded?'pin':'stick')||document.getElementById('pin');if(el)document.documentElement.style.setProperty('--pin-h',el.offsetHeight+'px')}
function parseHash(){
  const h=location.hash.slice(1);
  if(!h)return {cut:null,sec:'',sub:'',el:''};
  if(/^(cut|sec|sub|view)=/.test(h)){const p=new URLSearchParams(h);return {cut:p.get('cut')||p.get('view')||null,sec:p.get('sec')||'',sub:p.get('sub')||'',el:''}}
  return {cut:null,sec:'',sub:'',el:h};
}
function writeHash(push){
  const p=new URLSearchParams();
  if(cut!==defaultCut)p.set('cut',cut);
  if(sec)p.set('sec',sec);
  if(sub)p.set('sub',sub);
  const next=p.toString()?('#'+p.toString()):(location.pathname+location.search);
  const cur=location.hash|| (location.pathname+location.search);
  if(cur===next)return;
  (push?history.pushState:history.replaceState).call(history,null,'',next);
}
function revealRow(el){if(!el)return;if(el.classList.contains('more')){const s=el.closest('.sub');if(s){s.classList.add('open');const b=s.querySelector('.mt');if(b)b.textContent='less'}}}
function scrollToId(id,smooth){const el=document.getElementById(id);if(!el)return false;revealRow(el);el.scrollIntoView({block:'start',behavior:smooth?'smooth':'auto'});return true}
function inSubMode(){return !!(sec&&namedSubs(catBySlug(sec)).length)}
function renderNav(){
  const cutslot=document.getElementById('cutslot');
  if(VIEWS.length>1){
    cutslot.hidden=false;
    cutslot.innerHTML=VIEWS.map(v=>`<button type="button" data-cut="${esc(v[0])}" class="${v[0]===cut?'on':''}">${esc(v[1])}</button>`).join('');
    cutslot.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.dataset.cut===cut)return;cut=b.dataset.cut;sec='';sub='';apply(true,true);scrollTo(0,0)});
  }else cutslot.hidden=true;
  const crumb=document.getElementById('crumb');
  const parts=[`<a href="../">Morning Briefing</a>`];
  parts.push(sec?`<a href="#" data-back="feed">${esc(FEEDNAME)}</a>`:`<span class="here">${esc(FEEDNAME)}</span>`);
  if(sec){const c=catBySlug(sec);parts.push(`<span class="here">${esc(c?c.cat:sec)}</span>`)}
  crumb.innerHTML=parts.join('<span class="sep"> › </span>');
  crumb.hidden=!sec;
  const back=crumb.querySelector('[data-back=feed]');
  if(back)back.onclick=e=>{e.preventDefault();sec='';sub='';apply(true,true);scrollTo(0,0)};
  const secs=document.getElementById('secs');
  const mode=inSubMode()?'sub':'sec';
  const tabs=mode==='sub'
    ?[{id:'',name:'All'},...namedSubs(catBySlug(sec)).map(s=>({id:slug(s.sub),name:s.sub}))]
    :[{id:'',name:'All'},...cats().map(x=>({id:slug(x.cat),name:label(x.cat)}))];
  const cur=mode==='sub'?sub:sec;
  secs.innerHTML=tabs.map(t=>`<button type="button" data-mode="${mode}" data-id="${esc(t.id)}" class="${t.id===cur?'on':''}">${esc(t.name)}</button>`).join('');
  secs.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const id=b.dataset.id;
    if(mode==='sub'){
      sub=id;writeHash(true);renderNav();
      id?scrollToId(cut+'-'+sec+'-'+id,true):document.querySelector(`.view[data-v="${cut}"] section:not([hidden])`)?.scrollIntoView({block:'start',behavior:'smooth'});
    }else{
      sec=id;sub='';apply(true,true);scrollTo(0,0);
    }
  });
  lastSpy=cur;
  setPinH();
  requestAnimationFrame(scrollActiveTab);
}
function scrollActiveTab(){
  const el=document.querySelector('#secs .on')||document.querySelector('#secs .spy');
  if(el)el.scrollIntoView({inline:'center',block:'nearest'});
}
function apply(doHash,push){
  document.querySelectorAll('.view').forEach(v=>v.hidden=v.dataset.v!==cut);
  const root=document.querySelector(`.view[data-v="${cut}"]`);
  if(root)root.querySelectorAll(':scope > section').forEach(s=>{
    const cid=s.id.slice(cut.length+1);
    const on=!sec||cid===sec;
    s.hidden=!on;
    if(on)s.classList.remove('closed');
  });
  try{localStorage.setItem('view:'+FEED,cut)}catch(e){}
  renderNav();
  if(doHash!==false)writeHash(!!push);
  setPinH();
}
function applyFromHash(){
  const st=parseHash();
  if(st.cut&&VIEWS.some(v=>v[0]===st.cut))cut=st.cut;
  else{try{const pv=localStorage.getItem('view:'+FEED);if(pv&&VIEWS.some(v=>v[0]===pv))cut=pv}catch(e){}}
  sec=st.sec&&catBySlug(st.sec)?st.sec:'';
  sub=sec&&st.sub&&namedSubs(catBySlug(sec)).some(s=>slug(s.sub)===st.sub)?st.sub:'';
  apply(false);
  if(st.el)requestAnimationFrame(()=>scrollToId(st.el,false));
  else if(sub)requestAnimationFrame(()=>scrollToId(cut+'-'+sec+'-'+sub,false));
}
document.querySelectorAll('.top a').forEach(a=>a.addEventListener('click',e=>{
  const id=(a.getAttribute('href')||'').slice(1);const el=document.getElementById(id);if(!el)return;
  e.preventDefault();
  const section=el.closest('section');
  if(sec&&section&&section.hidden){sec='';sub='';apply(true,true)}
  scrollToId(id,true);
}));
function spy(){
  if(sec&&!inSubMode())return;
  const mode=inSubMode()?'sub':'sec';
  const pinH=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--pin-h'))||0;
  const y=pinH+20;
  let nodes;
  if(mode==='sec'){
    const root=document.querySelector(`.view[data-v="${cut}"]`);if(!root)return;
    nodes=[...root.querySelectorAll(':scope > section')].filter(s=>!s.hidden).map(s=>({id:s.id.slice(cut.length+1),el:s}));
  }else{
    nodes=namedSubs(catBySlug(sec)).map(s=>({id:slug(s.sub),el:document.getElementById(cut+'-'+sec+'-'+slug(s.sub))}));
  }
  let active='';
  for(const n of nodes){if(!n.el)continue;if(n.el.getBoundingClientRect().top<=y)active=n.id}
  document.querySelectorAll('#secs button').forEach(b=>{
    if(b.dataset.mode!==mode)return;
    b.classList.toggle('on',b.dataset.id===active);
  });
  if(active!==lastSpy){lastSpy=active;scrollActiveTab()}
}
const pin=document.getElementById('pin');
const onScroll=()=>{if(pin)pin.classList.toggle('scrolled',scrollY>16);setPinH();spy()};
addEventListener('scroll',onScroll,{passive:true});
addEventListener('resize',()=>{setPinH();scrollActiveTab()});
addEventListener('hashchange',applyFromHash);
addEventListener('popstate',applyFromHash);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{setPinH();spy()});
applyFromHash();
onScroll();
