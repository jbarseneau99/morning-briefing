<style>
:root{
  --pin-h:96px;
  --bg:#f4f1eb;--paper:#fffcf7;--ink:#141311;--mut:#5c5a55;--line:#ddd8ce;--rule:#141311;

  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:light;overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;padding-top:var(--pin-h);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:var(--acc)}
.frame{display:block}
.stick{position:fixed;top:0;left:0;right:0;width:100%;z-index:80;background:var(--bg);border-top:2px solid var(--rule);border-bottom:1px solid var(--line);box-shadow:0 8px 18px -12px rgba(20,19,17,.2);padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.pin{display:flex;align-items:center;min-height:48px;box-sizing:border-box;position:relative}
header{max-width:none;margin:0;padding:0 12px;display:flex;align-items:center;min-height:48px;box-sizing:border-box}
.mast{display:flex;align-items:center;gap:8px;min-width:0;flex:1;border-top:0;padding:0;min-height:48px;box-sizing:border-box}
.nav-util{max-width:none;margin:0 0 0 auto;padding:0 8px 0 0;display:flex;align-items:center;gap:0;border-bottom:0;min-width:0;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;-webkit-overflow-scrolling:touch;min-height:48px;box-sizing:border-box}
.side{max-width:900px;margin:0 auto;padding:0 20px;display:grid;grid-template-columns:1fr auto;grid-template-areas:"crumb crumb" "secs cut";align-items:end;column-gap:12px}
.side:not(:has(.nav-cut:not([hidden]))){grid-template-areas:"crumb crumb" "secs secs"}
.nav-util::-webkit-scrollbar{display:none}
.nav-util a{font:600 11.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;padding:0;margin-right:16px;color:var(--mut);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;min-height:44px;min-width:44px;flex:0 0 auto;white-space:nowrap;box-sizing:border-box}
.nav-util a:hover{color:var(--ink)}
.nav-util a.on,.nav-util a[aria-current=page]{color:var(--ink);border-bottom-color:var(--ink)}
.nav-crumb{grid-area:crumb;font-size:12.5px;color:var(--mut);padding:7px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.nav-crumb a{color:var(--mut);text-decoration:none}
.nav-crumb a:hover{color:var(--acc)}
.nav-crumb .here{color:var(--ink)}
.nav-crumb .sep{margin:0 .15em;color:var(--mut)}
.nav-secs{grid-area:secs;display:flex;min-width:0;overflow-x:auto;overscroll-behavior-x:contain;flex-wrap:nowrap;scrollbar-width:none;gap:0;-webkit-overflow-scrolling:touch;border-bottom:1px solid var(--line)}
.nav-secs::-webkit-scrollbar{display:none}
.nav-secs button{flex:0 0 auto;font:600 15px/1 var(--sans);padding:0 8px;margin-right:8px;border:0;background:none;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;border-radius:0;display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;box-sizing:border-box}
.nav-secs button:hover{color:var(--ink)}
.nav-secs button.on{color:var(--ink);border-bottom-color:var(--acc)}
.nav-secs button.spy{color:var(--ink)}
.nav-cut{grid-area:cut;display:flex;align-items:center;padding:0 0 8px;border-bottom:1px solid var(--line)}
.nav-crumb[hidden],.nav-cut[hidden]{display:none!important}
.nav-cut button{font:600 11px/1 var(--sans);letter-spacing:.03em;padding:0 10px;border:1px solid var(--line);background:transparent;color:var(--mut);cursor:pointer;margin:0 0 0 -1px;min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box}
.nav-cut button:first-child{margin-left:0;border-radius:3px 0 0 3px}
.nav-cut button:last-child{border-radius:0 3px 3px 0}
.nav-cut button.on{background:var(--ink);color:var(--paper);border-color:var(--ink);position:relative;z-index:1}
.nav-cut[hidden]{display:none}
section,.row,.sub,.ch{scroll-margin-top:calc(var(--pin-h) + 12px)}
.kicker{display:none}
.logo-link{display:inline-flex;align-items:center;gap:8px;flex:0 0 auto;min-width:44px;min-height:44px;color:var(--ink);text-decoration:none}
.logo-mark{width:24px;height:24px;display:block;flex:0 0 auto;color:var(--ink)}
.logo-word{height:22px;width:auto;aspect-ratio:1000/258.41;display:block;flex:0 0 auto}
.logo-dark{display:none}
.byline{margin:0;color:var(--mut);font:500 10px/1.2 var(--sans);letter-spacing:.08em;font-variant-caps:all-small-caps;text-transform:lowercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.byline .sep{font-variant-caps:normal;letter-spacing:0;margin:0 .35em}
.byline .ed{font-variant-caps:normal;letter-spacing:.01em;font-weight:400;text-transform:none;color:var(--mut)}
header h1{margin:0;font:650 15px/1.1 var(--serif);letter-spacing:-.02em;white-space:nowrap;min-width:0}
header h1 a{color:inherit;text-decoration:none}
.ed{margin:0;color:var(--mut);font-size:10px;letter-spacing:.01em}
#send{display:none;flex:0 0 auto;margin-left:auto;border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:0;padding:0 8px;cursor:pointer;font:600 10px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;min-height:32px;align-items:center;justify-content:center}
#send:hover{background:var(--ink);color:var(--paper)}
main{max-width:900px;margin:0 auto;padding:16px 20px max(72px,calc(72px + env(safe-area-inset-bottom,0px)))}
section{background:transparent;border:0;border-radius:0;margin:1.8rem 0 0;overflow:visible}
.view>section:first-child{margin-top:.4rem}
.ch{display:flex;align-items:baseline;gap:10px;padding:0 0 10px;cursor:pointer;user-select:none;border-bottom:2px solid var(--rule)}
.ch h2{margin:0;font:650 1.45rem/1.15 var(--serif);flex:1;letter-spacing:-.015em}
.car{transition:transform .2s;color:var(--mut);font-size:13px;line-height:1}
section.closed .car{transform:rotate(-90deg)}
section.closed .body{display:none}
section.closed .ch{border-bottom-width:1px;border-bottom-color:var(--line)}
.top{padding:14px 0 4px}
.top h4{margin:0 0 8px;font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.top ol{margin:0;padding-left:1.15rem;font-size:15px}
.top li{min-height:44px;padding:8px 0;box-sizing:border-box}
.top a{color:var(--ink);text-decoration:none;font-family:var(--serif);font-weight:550}
.top a:hover{color:var(--acc)}
.sh{display:flex;align-items:center;gap:8px;padding:18px 0 2px}
.sh span.t{flex:1;font:600 11.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.row{display:flex;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.sh+.row{border-top:0;padding-top:10px}
.th,.ph{flex:0 0 120px;flex-shrink:0;align-self:flex-start;width:120px;aspect-ratio:3/2;height:auto;border-radius:2px;object-fit:cover;background:var(--wash)}
.ph{display:flex;align-items:center;justify-content:center;color:#9a968e;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.tx{flex:1;min-width:0}
.tx b{display:block;font:600 1.12rem/1.28 var(--serif);letter-spacing:-.01em}
.tx .n{color:var(--mut);font-weight:500;margin-right:.4em;font-variant-numeric:tabular-nums;font-family:var(--sans);font-size:.86em}
.tx p{margin:4px 0 0;color:#3a3834;font-size:15px;line-height:1.45}
.tx a{color:var(--acc);font-size:13px;font-weight:600;letter-spacing:.02em;text-decoration:none}
.tx a:hover{text-decoration:underline}
.dt{color:var(--mut);font-size:13px}
.more{display:none}
.sub.open .more{display:flex}
.mt{margin:2px 0 8px;border:0;background:none;color:var(--mut);cursor:pointer;font:600 13px/1.4 var(--sans);padding:0;letter-spacing:.02em;min-height:44px;display:inline-flex;align-items:center}
.mt:hover{color:var(--acc)}
.v{display:flex;flex-direction:column;gap:0;align-items:center;flex:0 0 auto;margin-left:4px}
.v button{border:0;background:transparent;border-radius:3px;cursor:pointer;font-size:14px;padding:0;opacity:.4;line-height:1;color:var(--ink);min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box}
.v button:hover{opacity:1;background:var(--wash)}
.v button.on{opacity:1}
.v button.on.up{background:#e7f1ea;color:var(--up)}
.v button.on.dn{background:#f6e8e4;color:var(--dn)}
.v button.on.ne{background:var(--wash);color:var(--ne)}
.ch .v,.sh .v{flex-direction:row;align-items:center}
.ch .v button{font-size:14px}
@media(max-width:599px){
  .pin,.side{display:contents}
  .stick{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"header util" "crumb crumb" "secs cut";column-gap:4px;align-items:center}
  .stick:not(:has(.nav-cut:not([hidden]))){grid-template-areas:"header util" "crumb crumb" "secs secs"}
  header{grid-area:header;max-width:none;padding:0 0 0 12px;min-height:48px}
  .nav-util{grid-area:util;max-width:none;padding:0 12px 0 4px;min-height:48px}
  .nav-cut{grid-area:cut;justify-content:flex-end;padding:0 12px 0 0;border-bottom:0}
  .nav-crumb{padding-left:12px;padding-right:12px}
  .nav-secs{padding:0 12px}
  main{padding-left:14px;padding-right:14px}
  header h1{font-size:14px}
  .logo-word,.byline,#send{display:none!important}
  .nav-util a{margin-right:8px}
  .nav-secs button{margin-right:12px;font-size:14px}
  .pin.scrolled .nav-crumb{padding-top:2px;font-size:12px}
  .th,.ph{flex:0 0 76px;flex-shrink:0;align-self:flex-start;width:76px;aspect-ratio:3/2;height:auto;object-fit:cover}
  .tx b{font-size:1.02rem}
  .tx p{font-size:14px}
  .row{gap:10px;padding:10px 0}
}
@media(max-width:430px){
  header{padding-left:10px}
  .nav-util{padding-right:10px}
  .nav-cut{padding-right:10px}
  .nav-crumb,.nav-secs,main{padding-left:12px;padding-right:12px}
  header h1{font-size:13.5px}
  .tx b{font-size:1rem}
  .tx p{font-size:13.5px;line-height:1.4}
  .row{gap:8px;padding:8px 0}
  .th,.ph{flex:0 0 72px;width:72px}
}
@media(max-height:420px) and (min-aspect-ratio:5/4){
  .byline,.logo-word,#send{display:none!important}
  header h1{font-size:13.5px}
}
@media(min-width:600px) and (min-height:520px) and (min-aspect-ratio:3/4){
  body{padding-top:0}.frame{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,3fr);grid-template-rows:var(--pin-h) 1fr;grid-template-areas:"pin pin" "side main";align-items:start;width:100%;max-width:1400px;margin:0 auto}
  .stick{display:contents;position:static;padding:0;border:0;box-shadow:none;background:transparent}
  .pin{grid-area:pin;position:fixed;top:0;left:0;right:0;width:auto;z-index:80;min-height:0;background:var(--bg);border-top:2px solid var(--rule);border-bottom:1px solid var(--line);box-shadow:0 8px 18px -12px rgba(20,19,17,.2);padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .pin{display:flex;align-items:center;min-height:0;box-sizing:border-box}
  header,.nav-util{max-width:none;margin:0}
  header{flex:1;min-width:0;padding:0 12px 0 16px;min-height:52px}
  .mast{min-height:52px}
  .nav-util{flex:0 0 auto;padding:0 16px 0 8px;min-height:52px;border-bottom:0}
  #send{display:inline-flex}
  .side{grid-area:side;display:block;position:-webkit-sticky;position:sticky;top:var(--pin-h);z-index:40;align-self:start;box-sizing:border-box;width:100%;max-width:none;margin:0;height:calc(100dvh - var(--pin-h) - env(safe-area-inset-bottom,0px));overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--bg);border-right:1px solid var(--line);padding:16px 16px max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .nav-crumb{display:block;white-space:normal;overflow:visible;text-overflow:unset;padding:0 0 12px;line-height:1.4}
  .nav-cut{display:flex;justify-content:flex-start;border-bottom:0;padding:0 0 14px;margin:0}
  .nav-secs{display:flex;flex-direction:column;align-items:stretch;overflow:visible;flex-wrap:nowrap;border-bottom:0;margin:0;padding:0;gap:0}
  .nav-secs button{width:100%;margin:0;padding:0 12px;justify-content:flex-start;text-align:left;white-space:normal;border-bottom:0;border-left:2px solid transparent;border-radius:0;min-height:44px;min-width:44px}
  .nav-secs button.on,.nav-secs button.spy{border-left-color:var(--acc);background:var(--wash);color:var(--ink)}
  main{grid-area:main;max-width:none;margin:0;padding:16px 20px max(72px,calc(32px + env(safe-area-inset-bottom,0px))) 24px;container-type:inline-size;container-name:stories}
  .row{padding:12px 0}
  .th,.ph{flex:0 0 100px;width:100px}
}
@container stories (min-width:520px){
  .sub{display:grid;grid-template-columns:1fr 1fr;column-gap:20px;align-items:start}
  .sub>.sh,.sub>.mt{grid-column:1/-1}
  .th,.ph{flex:0 0 72px;width:72px}
  .tx b{font-size:1.05rem}
  .tx p{font-size:14px}
}
@media(horizontal-viewport-segments:2){
  .frame{grid-template-columns:env(viewport-segment-width 0 0,1fr) env(viewport-segment-width 1 0,3fr)}
}
@media(prefers-color-scheme:dark){
  :root{--bg:#1c1b19;--paper:#24221f;--ink:#f3efe6;--mut:#a8a49a;--line:#3a3732;--rule:#f3efe6;--acc:#e06a4f;--wash:#2c2a26;--up:#7dcea0;--dn:#e06a4f;--ne:#b0aca3}
  html{color-scheme:dark}
  body{background:var(--bg);color:var(--ink)}
  .stick,.pin,.side{box-shadow:none}
  .stick,.pin{box-shadow:0 8px 18px -12px rgba(0,0,0,.55)}
  .tx p{color:#d7d2c8}
  .ph{color:#7a756c}
  #send:hover{background:var(--ink);color:var(--bg)}
  .nav-cut button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .v button.on.up{background:#1d3a2a;color:var(--up)}
  .v button.on.dn{background:#3a221e;color:var(--dn)}
  .v button.on.ne{background:var(--wash);color:var(--ne)}
  .logo-word.logo-light{display:none}
  .logo-word.logo-dark{display:block}
  .logo-mark{color:var(--ink)}
}
@media (display-mode: standalone), (display-mode: fullscreen), (display-mode: minimal-ui){
  .stick,.pin{padding-top:env(safe-area-inset-top,0px)}
}

#refresh{flex:0 0 auto;width:44px;height:44px;margin:0;padding:0;border:0;background:transparent;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;border-radius:0}
#refresh:hover{color:var(--acc)}
#refresh svg{width:20px;height:20px;display:block}
#refresh.busy svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.updated{flex:0 0 auto;color:var(--mut);font:500 10px/1 var(--sans);letter-spacing:.04em;white-space:nowrap;margin:0 4px 0 0}
#refresh-bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--acc);transform-origin:left;transform:scaleX(0);pointer-events:none;z-index:90}
#refresh-bar.on{display:block;animation:loadbar 1s ease-in-out infinite}
@keyframes loadbar{0%{transform:scaleX(0);opacity:.3}50%{transform:scaleX(1);opacity:1}100%{transform:scaleX(0);opacity:.3}}
.tag-new{display:inline-block;margin:0 6px 0 0;padding:1px 5px;border:1px solid var(--acc);color:var(--acc);font:650 9px/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;vertical-align:middle}
.row.fresh{animation:freshfade 2.8s ease}
@keyframes freshfade{0%{background:color-mix(in srgb,var(--acc) 16%,transparent)}100%{background:transparent}}
#toast{position:fixed;left:50%;bottom:max(24px,calc(16px + env(safe-area-inset-bottom,0px)));transform:translateX(-50%);background:var(--ink);color:var(--paper);font:600 13px/1.3 var(--sans);letter-spacing:.02em;padding:10px 16px;border-radius:2px;z-index:200;box-shadow:0 8px 24px rgba(20,19,17,.25);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}

/* in-app reader */
.row .th,.row .ph,.row .tx b,.row .rlink{cursor:pointer}
a.rlink{display:flex;gap:inherit;align-items:flex-start;flex:1;min-width:0;color:inherit;text-decoration:none;-webkit-tap-highlight-color:rgba(155,44,26,.12)}
a.rlink:hover b{color:var(--acc)}
.row .rs{color:var(--acc);font:600 13px/1.4 var(--sans)}
.buildstamp{margin:24px 0 8px;padding:0 4px;color:var(--mut);font:500 10px/1.2 var(--sans);letter-spacing:.06em;opacity:.7}
#reader{display:none;background:var(--bg);min-width:0;box-sizing:border-box}
body.reading{overflow:hidden;overscroll-behavior:none;height:100vh;height:-webkit-fill-available;height:100dvh}
body.reading .buildstamp{display:none!important}
body.reading #m{display:none!important}
body.reading #reader{
  display:flex;flex-direction:column;
  position:fixed;z-index:50;
  top:var(--pin-h);left:0;right:0;bottom:0;
  width:auto;
  height:calc(100vh - var(--pin-h));
  height:calc(100dvh - var(--pin-h));
  min-height:calc(100vh - var(--pin-h));
  min-height:calc(100dvh - var(--pin-h));
  padding:0 16px env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden;
  background:var(--bg);
}
.rbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:relative;top:auto;z-index:5;flex:0 0 auto;background:var(--bg);border-bottom:1px solid var(--line);padding:4px 0 8px;margin:0 0 12px}
#rback{flex:0 0 auto;width:44px;height:44px;margin:0;padding:0;border:0;background:transparent;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
#rback:hover{color:var(--acc)}
#rback svg{display:block}
.rsrc{font:650 11.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);min-width:0}
.rorig{margin-left:auto;font:600 12px/1 var(--sans);letter-spacing:.04em;color:var(--acc);text-decoration:none;min-height:44px;display:inline-flex;align-items:center;padding:0 4px;white-space:nowrap}
.rorig:hover{text-decoration:underline}
#rvotes{flex:0 0 auto}
#rbody{max-width:720px;flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
#rbody.loading{display:flex;align-items:center;justify-content:center;min-height:0;flex:1 1 auto;color:var(--mut)}
#rbody .rspinner{width:28px;height:28px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite}
#rbody h1{font:600 1.7rem/1.25 var(--serif);margin:0 0 8px;color:var(--ink)}
#rbody .rby{margin:0 0 16px;color:var(--mut);font:500 14px/1.4 var(--sans)}
#rbody .rby .rdate{font-weight:400}
#rbody .rhero{display:block;width:100%;max-height:360px;object-fit:cover;border-radius:2px;margin:0 0 20px;background:var(--wash)}

    const tv=views.find(v=>v[0]==='topic'); if(tv) placed.push(['topic',into(tv[2],topicName||catName,'')]);
  }else{
    placed.push(['all',into(DATA,catName,subName)]);
  }
  // paint into any already-rendered matching sub
  placed.forEach(([V,info])=>{
    if(!info)return;
    const {c,s,item}=info;
    const root=document.querySelector(`.view[data-v="${V}"]`)||document.querySelector('.view');
    if(!root)return;
    const sec=root.querySelector(`:scope > section[id="${CSS.escape(V+'-'+slug(c.cat))}"]`);
    if(!sec){ // new section — rebuild this view
      const view=VIEWS.find(v=>v[0]===V); if(!view)return;
      const wrap=document.querySelector(`.view[data-v="${V}"]`);
      if(wrap){wrap.innerHTML=renderCats(view[2],V);bindCh(wrap);bindVotes(wrap)}
      return;
    }
    const body=sec.querySelector('.body');
    let subEl=[...sec.querySelectorAll('.sub')].find(el=>{
      if(!s.sub)return !el.querySelector('.sh');
      return el.id===`${V}-${slug(c.cat)}-${slug(s.sub)}`;
    });
    if(!subEl){
      subEl=document.createElement('div'); subEl.className='sub';
      if(s.sub)subEl.id=`${V}-${slug(c.cat)}-${slug(s.sub)}`;
      subEl.innerHTML=(s.sub?`<div class="sh"><span class="t">${esc(s.sub)}</span>${votes('subcategory',slug(c.cat)+'/'+slug(s.sub),c.cat+' › '+s.sub)}</div>`:'');
      body.appendChild(subEl);
    }
    const html=row(item,s.items.length>5?'more fresh':'fresh',V,c.cat+(s.sub?' › '+s.sub:''));
    const mt=subEl.querySelector('.mt');
    if(mt){mt.insertAdjacentHTML('beforebegin',html);const extra=subEl.querySelectorAll('.more').length;mt.textContent=subEl.classList.contains('open')?'less':`…more (${extra})`}
    else{
      subEl.insertAdjacentHTML('beforeend',html);
      if(s.items.length>5){const b=document.createElement('button');b.className='mt';b.textContent=`…more (${s.items.length-5})`;b.addEventListener('click',()=>{subEl.classList.toggle('open');b.textContent=subEl.classList.contains('open')?'less':`…more (${subEl.querySelectorAll('.more').length})`});subEl.appendChild(b)}
    }
    bindVotes(subEl);
  });
}
function bindCh(root){(root||document).querySelectorAll('.ch').forEach(e=>{if(e.dataset.bound)return;e.dataset.bound='1';e.addEventListener('click',ev=>{if(ev.target.closest('.v'))return;e.parentElement.classList.toggle('closed')})});
 (root||document).querySelectorAll('.mt').forEach(b=>{if(b.dataset.bound)return;b.dataset.bound='1';b.addEventListener('click',()=>{const s=b.parentElement;s.classList.toggle('open');b.textContent=s.classList.contains('open')?'less':`…more (${s.querySelectorAll('.more').length})`})})}
let refreshing=false;
async function refreshNews(opts){const quiet=opts&&opts.quiet;if(refreshing)return;refreshing=true;
  const btn=document.getElementById('refresh'), bar=document.getElementById('refresh-bar');
  if(btn)btn.classList.add('busy'); if(bar){bar.hidden=false;bar.classList.add('on')}
  try{
    const j=await fetch('latest.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()});
    if(j.date&&j.date>DATE){toast('New edition available');location.reload();return}
    const have=allStoryIds();
    const fresh=(j.stories||[]).filter(s=>s&&s.id&&!have.has(s.id));
    fresh.forEach(appendItem);
    if(fresh.length){renderNav();setPinH()}
    setUpdated(j.updated_at);
    if(!quiet||fresh.length)toast(fresh.length?(fresh.length+' new '+(fresh.length===1?'story':'stories')):('Up to date · updated '+fmtHM(j.updated_at)));
  }catch(e){if(!quiet)toast('Could not refresh')}
  finally{refreshing=false;if(btn)btn.classList.remove('busy');if(bar){bar.classList.remove('on');bar.hidden=true}}
}
const _rb=document.getElementById('refresh'); if(_rb)_rb.addEventListener('click',()=>refreshNews());
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshNews({quiet:true})});
// pull-to-refresh (standalone PWA has no Safari reload)
let ptrY=0, ptring=false;
addEventListener('touchstart',e=>{if(scrollY>2||refreshing)return;const t=e.target;if(t&&t.closest&&t.closest('#pin,#stick,#refresh'))return;ptrY=e.touches[0].clientY;ptring=true},{passive:true});
addEventListener('touchmove',e=>{if(!ptring)return;const dy=e.touches[0].clientY-ptrY;if(dy>72&&scrollY<2){ptring=false;refreshNews()}},{passive:true});
addEventListener('touchend',()=>{ptring=false},{passive:true});
bindCh();
bindVotes(document);
// ----- in-app reader -----
const STORY={};
(function indexStories(){
  const views=Array.isArray(DATA)?[['all','',DATA]]:DATA.views;
  for(const v of views)for(const c of (v[2]||[]))for(const s of (c.subs||[]))for(const it of (s.items||[]))if(it&&it[7])STORY[it[7]]=it;
})();
let readerPushed=false, listScroll=0, readerId='';
function readerHash(id){
  const h=location.hash.slice(1);
  if(h&&/^(cut|sec|sub|view|read)=/.test(h)){const p=new URLSearchParams(h);p.set('read',id);return '#'+p.toString()}
  return '#read='+encodeURIComponent(id);
}
function stripReadHash(){
  const st=parseHash();
  if(!st.read)return location.pathname+location.search+(location.hash||'');
  const h=location.hash.slice(1);
  if(/^(cut|sec|sub|view|read)=/.test(h)){const p=new URLSearchParams(h);p.delete('read');const q=p.toString();return q?('#'+q):(location.pathname+location.search)}
  return location.pathname+location.search;
}
function closeReader(fromPop){
  if(!document.body.classList.contains('reading')&&!readerId)return;
  if(!fromPop && readerPushed){history.back();return}
  document.body.classList.remove('reading');
  const panel=document.getElementById('reader'); if(panel)panel.hidden=true;
  readerId=''; readerPushed=false;
  requestAnimationFrame(()=>{scrollTo(0,listScroll||0)});
}
function renderReader(rec, item){
  const title=rec.title||(item&&item[1])||'';
  const src=rec.source||(item&&item[3])||'';
  const url=rec.url||(item&&item[4])||'#';
  const by=rec.byline||'';
  const date=rec.date||(item&&item[5])||'';
  const sum=rec.summary||(item&&item[2])||'';
  const img=rec.image||(rec.thumb?('../img/'+rec.thumb):'')||(item&&item[6]?('../img/'+item[6]):'');
  const id=rec.id||(item&&item[7])||'';
  document.getElementById('rsrc').textContent=src;
  const orig=document.getElementById('rorig'); orig.href=url; orig.hidden=!url||url==='#';
  document.getElementById('rvotes').innerHTML=votes('story',id,title,` data-url="${esc(url)}"`);
  bindVotes(document.getElementById('rvotes'));
  let body='';
  if(title)body+=`<h1>${esc(title)}</h1>`;
  if(by||date)body+=`<p class="rby">${by?esc(by):''}${by&&date?' · ':''}${date?`<span class="rdate">${esc(date)}</span>`:''}</p>`;
  if(img)body+=`<img class="rhero" src="${esc(img)}" alt="">`;
  if(rec.status==='full'&&rec.html){
    body+=`<div class="rhtml">${rec.html}</div>`;
  }else{
    const why=rec.reason==='paywall'?'This article looks paywalled or limited at the source.':
              rec.reason==='blocked'?'The publisher blocked a full-text copy.':
              'A full-text version was not available.';
    body+=`<div class="rnote">${why} <a href="${esc(url)}" target="_blank" rel="noopener">Open the original at ${esc(src||'the source')}</a>.</div>`;
    if(sum)body+=`<p class="rsum">${esc(sum)}</p>`;
  }
  const box=document.getElementById('rbody');
  box.classList.remove('loading');
  box.innerHTML=body;
}
async function openReader(id,push){
  if(!id)return;
  if(document.body.classList.contains('reading')&&readerId===id&&!push)return;
  if(!document.body.classList.contains('reading'))listScroll=scrollY;
  readerId=id;
  document.body.classList.add('reading');
  const panel=document.getElementById('reader'); if(panel)panel.hidden=false;
  const box=document.getElementById('rbody');
  box.classList.add('loading'); box.innerHTML='<div class="rspinner" role="status" aria-label="Loading article"></div>';
  document.getElementById('rsrc').textContent='';
  document.getElementById('rvotes').innerHTML='';
  const item=STORY[id];
  if(item){
    document.getElementById('rsrc').textContent=item[3]||'';
    const orig=document.getElementById('rorig'); orig.href=item[4]||'#'; orig.hidden=!item[4];
    document.getElementById('rvotes').innerHTML=votes('story',id,item[1]||'',` data-url="${esc(item[4]||'')}"`);
    bindVotes(document.getElementById('rvotes'));
  }
  if(push){readerPushed=true;history.pushState({read:id},'',readerHash(id))}
  else readerPushed=false;
  try{
    const rec=await fetch('../articles/'+DATE+'/'+id+'.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()});
    if(readerId!==id)return;
    renderReader(rec,item);
  }catch(e){
    if(readerId!==id)return;
    renderReader({id,status:'fallback',reason:'blocked',title:item?item[1]:'',source:item?item[3]:'',url:item?item[4]:'',summary:item?item[2]:'',date:item?item[5]:'',html:'',thumb:item?item[6]:''},item);
  }
  const scrollBox=document.getElementById('rbody');
  if(scrollBox)scrollBox.scrollTop=0;
  if(!window.matchMedia('(min-width:600px) and (min-height:520px) and (min-aspect-ratio:3/4)').matches)scrollTo(0,0);
}
document.getElementById('rback').addEventListener('click',()=>closeReader(false));
function storyIdFromEvent(e){
  if(e.target.closest('.v,.mt,.ch,.unl,#rback,#rorig,.rorig'))return '';
  const a=e.target.closest('a.rlink');
  const row=e.target.closest('.row');
  if(a){
    const href=a.getAttribute('href')||'';
    const m=/read=([^&]+)/.exec(href);
    if(m)return decodeURIComponent(m[1]);
  }
  if(row)return row.getAttribute('data-id')||((row.id||'').split('-s')[1]||'');
  return '';
}
function onStoryActivate(e){
  const id=storyIdFromEvent(e); if(!id)return;
  e.preventDefault();
  if(e.stopPropagation)e.stopPropagation();
  openReader(id,true);
}
const _main=document.getElementById('m');
_main.addEventListener('click',onStoryActivate);

applyFromHash();
onScroll();
