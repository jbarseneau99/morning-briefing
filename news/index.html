<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1b1b1b;--mut:#666;--line:#e6e3dc;--acc:#1f5fbf;--up:#1e8e4e;--dn:#c0392b;--ne:#8a8a8a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{max-width:880px;margin:0 auto;padding:32px 20px 8px;display:flex;align-items:flex-end;gap:12px}header div{flex:1}header h1{margin:0;font:700 28px Georgia,serif}header p{margin:4px 0 0;color:var(--mut)}

section{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:16px 0;overflow:hidden}

.ch h2{margin:0;font-size:19px;flex:1}.car{transition:transform .2s;color:var(--mut)}section.closed .car{transform:rotate(-90deg)}section.closed .body{display:none}section.closed .ch{border-bottom:0}
.top{padding:10px 16px 12px;background:#fafaf7;border-bottom:1px solid var(--line)}.top h4{margin:0 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.top ol{margin:0;padding-left:20px;font-size:14.5px}.top a{color:var(--ink);text-decoration:none}.top a:hover{color:var(--acc)}
.sh{display:flex;align-items:center;gap:8px;padding:12px 16px 4px}.sh span.t{flex:1;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}
.row{display:flex;gap:14px;padding:11px 16px;border-top:1px solid #f0eee9}.sh+.row{border-top:0}
.th{flex:0 0 96px;width:96px;height:64px;border-radius:6px;object-fit:cover;background:#eee}
.ph{flex:0 0 96px;height:64px;border-radius:6px;background:linear-gradient(135deg,#ecebe6,#dcdad3);display:flex;align-items:center;justify-content:center;color:#999;font-size:11px}
.tx{flex:1;min-width:0}.tx b{display:block;font-size:16px}.tx .n{color:var(--mut);font-weight:400;margin-right:4px}
.tx p{margin:3px 0;color:#333;font-size:14.5px}.tx a{color:var(--acc);font-size:13px;text-decoration:none}.tx a:hover{text-decoration:underline}.dt{color:var(--mut);font-size:13px}
.more{display:none}.sub.open .more{display:flex}
.mt{margin:4px 16px 12px;border:0;background:none;color:var(--acc);cursor:pointer;font-size:14px;padding:4px 0}
.v{display:flex;gap:3px;align-items:flex-start;flex:0 0 auto}.v button{border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font-size:13px;padding:2px 6px;opacity:.7;line-height:1.4}
.v button:hover{opacity:1}.v button.on.up{background:var(--up);border-color:var(--up);opacity:1}.v button.on.dn{background:var(--dn);border-color:var(--dn);opacity:1}.v button.on.ne{background:var(--ne);border-color:var(--ne);color:#fff;opacity:1}
.ch .v button{font-size:15px;padding:3px 8px}
</style></head><body>

re private-sector-style defence procurement.", "National Post", "https://nationalpost.com/news/canada/feds-create-new-crown-corporation-to-move-with-urgency-on-defence-procurement", "Oct 6", null, "uf583ee36df"], [14, "Judge blocks Trump administration fines of up to $1.8M on migrants", "DHS has issued about 103,000 penalties totalling $84B; the court said it skipped required rulemaking.", "Fox News", "https://www.foxnews.com/politics/federal-judge-blocks-trump-administration-fines-up-1-8m-migrants", "Oct 7", "18de8b8c81.jpg", "u4d6057c8f0"], [15, "Trump administration moves to revoke colleges' tax exemptions over diversity programs", "Proposed rules leave universities unsure what would be forbidden.", "POLITICO", "https://www.politico.com/news/2026/10/07/college-tax-exempt-trump-regulations-01105427", "Oct 7", null, "u20ff31bc59"], [16, "Supreme Court opens its term with a major climate-liability case", "Boulder County's suit against oil companies could set the rules for dozens of similar cases.", "SCOTUSblog", "https://www.scotusblog.com/2026/10/the-first-monday-in-october/", "Oct 5", "e21aaccc30.jpg", "u2a49107e33"], [17, "Alito says the Supreme Court can't stem the rise of emergency appeals", "He also said he will stay on the court through next year.", "PBS News", "https://www.pbs.org/newshour/politics/alito-says-supreme-court-cant-stem-rise-of-emergency-appeals-not-pleased-with-trumps-rhetoric", "Oct 6", "0864699622.jpg", "ua1a78fa757"], [18, "Government to announce its next steps on MAID for mental illness Wednesday", "Expansion takes effect in March unless Ottawa intervenes.", "CBC News", "https://www.cbc.ca/news/politics/government-next-steps-maid-9.7371457", "Oct 6", "69ab6abec3.jpg", "ud2681d85e7"], [19, "Sheinbaum says a US-backed police academy in Querétaro lacks federal authorization", "She demanded that the U.S. ambassador and the state governor follow Mexican law.", "El País (Spanish)", "https://elpais.com/mexico/2026-10-06/sheinbaum-insiste-en-su-reclamo-contra-la-escuela-de-policias-en-queretaro-no-tiene-autorizacion.html", "Oct 6", "fe86cdc900.jpg", "u4f2a22e9e9"]]}]}, {"cat": "Latin America", "subs": [{"sub": "", "items": [[20, "Flávio Bolsonaro edges Lula in Brazil's first round, 47% to 45%", "The runoff is Oct. 25, and Bolsonaro's party nearly doubled its Senate seats.", "AFP", "https://www.afp.com/en/bolsonaro-rides-right-wing-surge-brazils-election-runoff", "Oct 6", "313c532d25.jpg", "u1145591d07"], [21, "Argentine court rules Milei's university-funding decree unconstitutional", "It orders immediate transfers to public universities.", "teleSUR", "https://www.telesurenglish.net/argentina-university-unconstitutional/", "Oct 6", null, "u631e000bac"], [22, "Chile withdraws a security reform that loosened states of exception", "The government is backing a cross-party Senate text instead.", "Infobae (Spanish)", "https://www.infobae.com/america/agencias/2026/10/06/gobierno-de-chile-retira-la-reforma-de-seguridad-que-flexibilizaba-el-estado-de-excepcion/", "Oct 6", null, "u459c9a2095"]]}]}, {"cat": "Europe & Asia", "subs": [{"sub": "", "items": [[23, "More than 250,000 rally across France over school funding; police use tear gas", "The protests pile pressure on Macron early in the presidential campaign.", "NPR", "https://www.npr.org/2026/10/06/nx-s1-5992819/france-student-protests-schools", "Oct 6", "908e690a54.jpg", "ud78990eaec"], [24, "Former German spy chief August Hanning arrested on suspicion of treason", "Prosecutors say he passed state secrets to a foreign intelligence service.", "NPR", "https://www.npr.org/2026/10/06/g-s1-146630/germany-ex-spy-chief-state-secrets", "Oct 6", "cc26305892.jpg", "u1156edc6c5"], [25, "EU proposes a 15-year probation for new members", "New states could lose funds or voting rights for rule-of-law breaches.", "Euronews", "https://www.euronews.com/2026/10/06/new-eu-members-face-15-year-probation-period-after-joining-the-bloc", "Oct 6", "c753b5e6f4.jpg", "ue7c9a54a7f"], [26, "Spain's Sánchez calls a snap election for Nov. 29", "It follows Congress rejecting his housing decrees.", "EuroUpdate", "https://euroupdate.eu/index.php/2026/10/06/europe-today-sanchez-calls-snap-election-in-spain-as-french-students-protest-again/", "Oct 6", null, "u58ddb94f1b"], [27, "Japan's Takaichi calls China 'an important neighbor' as Taiwan tensions persist", "She pledged dialogue while standing firm on maritime disputes.", "Anadolu", "https://u.aa.com.tr/en/asia-pacific/japans-prime-minister-calls-china-an-important-neighbor-amid-tensions-over-taiwan/4079077", "Oct 6", "bc57d0a521.jpg", "u468c38ac72"], [28, "Japan orders a Chinese survey ship out of its waters near Okinawa", "The research vessel Kexue left after repeated coast guard warnings.", "HKFP", "https://hongkongfp.com/2026/10/06/japan-says-it-told-china-survey-ship-to-leave-tokyos-economic-waters/", "Oct 6", "35b11cb6b2.jpg", "ufcf84085e0"], [29, "Xi leaves Japan unsure of a summit at APEC in Shenzhen", "Tokyo hopes for a Takaichi–Xi meeting in November.", "Nikkei Asia", "https://asia.nikkei.com/politics/international-relations/japan-china-tensions/xi-leaves-japan-uncertain-on-china-summit-at-apec", "Oct 7", "4571a545aa.jpg", "u4d8b8cc0ef"]]}]}], DATE='2026-10-07', REPO='jbarseneau99/morning-briefing', FEED='news', FEEDNAME='Global News';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug=s=>s.toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const votes=(level,id,title)=>`<span class="v" data-level="${level}" data-id="${id}" data-title="${esc(title)}"><button class="up" data-d="up" title="More like this">👍</button><button class="ne" data-d="neutral" title="Neutral">●</button><button class="dn" data-d="down" title="Less like this">👎</button></span>`;
const row=(it,cls='')=>{const [n,t,s,src,url,dt,img,id]=it;
 return `<div class="row ${cls}" id="s${id}">${img?`<img class="th" src="../img/${img}" alt="" loading="lazy">`:`<div class="ph">no image</div>`}<div class="tx"><b><span class="n">${n}.</span>${esc(t)}</b><p>${esc(s)}</p><a href="${url}" target="_blank" rel="noopener">${esc(src)}</a> <span class="dt">· ${dt}</span></div>${votes('story',id,t)}</div>`};
let h='';
for(const c of DATA){const cid=slug(c.cat);
 // group top 5: round-robin of each subgroup's ranked items
 const top=[];for(let r=0;top.length<5&&r<10;r++)for(const s of c.subs){if(s.items[r]&&top.length<5)top.push(s.items[r])}
 h+=`<section id="${cid}"><div class="ch"><span class="car">▾</span><h2>${esc(c.cat)}</h2>${votes('category',cid,c.cat)}</div><div class="body">`;
 if(!(c.subs.length===1&&!c.subs[0].sub))h+=`<div class="top"><h4>Top 5</h4><ol>${top.map(it=>`<li><a href="#s${it[7]}">${esc(it[1])}</a></li>`).join('')}</ol></div>`;
 for(const s of c.subs){if(!s.items.length)continue;const sid=cid+'/'+slug(s.sub);
  h+=`<div class="sub">`+(s.sub?`<div class="sh"><span class="t">${esc(s.sub)}</span>${votes('subcategory',sid,c.cat+' › '+s.sub)}</div>`:'');
  s.items.slice(0,10).forEach((it,i)=>h+=row(it,i>=5?'more':''));
  if(s.items.length>5)h+=`<button class="mt">…more (${Math.min(10,s.items.length)-5})</button>`;
  h+=`</div>`;}
 h+=`</div></section>`;}
document.getElementById('m').innerHTML=h;
document.querySelectorAll('.ch').forEach(e=>e.addEventListener('click',ev=>{if(ev.target.closest('.v'))return;e.parentElement.classList.toggle('closed')}));
document.querySelectorAll('.mt').forEach(b=>b.addEventListener('click',()=>{const s=b.parentElement;s.classList.toggle('open');b.textContent=s.classList.contains('open')?'less':`…more (${s.querySelectorAll('.more').length})`}));
const key=(l,i)=>`fb:${FEED}:${DATE}:${l}:${i}`;
document.querySelectorAll('.v').forEach(v=>{const {level,id,title}=v.dataset;const st=localStorage.getItem(key(level,id));
 if(st)v.querySelectorAll(`[data-d="${st}"]`).forEach(b=>b.classList.add('on'));
 v.querySelectorAll('button').forEach(b=>b.addEventListener('click',async ev=>{ev.stopPropagation();
  const was=b.classList.contains('on');v.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
  const vote=was?'clear':b.dataset.d; if(!was)b.classList.add('on');
  was?localStorage.removeItem(key(level,id)):localStorage.setItem(key(level,id),vote);
  // mirror state on duplicate controls (none currently)
  try{await fetch('feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({feed:FEED,date:DATE,level,id,title,vote})})}catch(e){}
 }))});
const icon={up:'👍',neutral:'●',down:'👎'};
document.getElementById('send').addEventListener('click',()=>{const lines=[],seen=new Set();
 document.querySelectorAll('.v').forEach(v=>{const k=key(v.dataset.level,v.dataset.id);if(seen.has(k))return;seen.add(k);const s=localStorage.getItem(k);if(s)lines.push(`${icon[s]} ${s} | ${v.dataset.level} ${v.dataset.id}: ${v.dataset.title}`)});
 if(!lines.length){alert('No votes yet.');return}
 const body=`feed: ${FEEDNAME}\ndate: ${DATE}\n\n`+lines.join('\n');
 if(!REPO||REPO.startsWith('__')){navigator.clipboard&&navigator.clipboard.writeText(body);alert('Feedback copied to clipboard:\n\n'+body);return}
 window.open(`https://github.com/${REPO}/issues/new?title=${encodeURIComponent((FEED==='news'?'Global News':'SciTech')+' feedback '+DATE)}&body=${encodeURIComponent(body)}`,'_blank');});
</script></body></html>
