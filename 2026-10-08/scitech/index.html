with prehistoric human migrations.", "Nature", "https://www.nature.com/articles/s41586-026-11106-1", "Oct 7", "99a4c95675.jpg", "u99a4c95675"], [79, "tRNA dosage regulates lineage dependency and resistance in prostate cancer", "Links tRNA levels to lineage dependency and treatment resistance in prostate tumours.", "Nature", "https://www.nature.com/articles/s41586-026-11153-8", "Oct 7", "6ce64903a1.jpg", "u6ce64903a1"], [80, "Structural basis for regulating lipopolysaccharide transmembrane transport", "Structural study of how bacteria regulate transport of lipopolysaccharide, a key outer-membrane component.", "Nature", "https://www.nature.com/articles/s41586-026-11129-8", "Oct 7", "7fe47bc100.jpg", "u7fe47bc100"], [81, "A shortcut to structure in AlphaFold 3", "Probing shows the MSA acts as a shortcut to the global fold.", "arXiv", "https://arxiv.org/abs/2610.08937", "Oct 6", "f86d95a0b5.jpg", "uf86d95a0b5"], [82, "OFAntibody: de novo design of monoclonal and bispecific antibodies", "An all-atom generative model that handles multi-target complexes.", "arXiv", "https://arxiv.org/abs/2610.09548", "Oct 7", "3dda1fd5ef.jpg", "u3dda1fd5ef"]]}]}], DATE='2026-10-08', REPO='jbarseneau99/morning-briefing', FEED='scitech', FEEDNAME='Science & Technology';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug=s=>s.toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const votes=(level,id,title,x='')=>`<span class="v" data-level="${level}" data-id="${id}" data-title="${esc(title)}"${x}><button class="up" data-d="up" title="More like this">👍</button><button class="ne" data-d="neutral" title="Neutral">●</button><button class="dn" data-d="down" title="Less like this">👎</button></span>`;
const row=(it,cls='',V='all',cat='')=>{const [n,t,s,src,url,dt,img,id]=it;
 const x=` data-url="${esc(url)}" data-img="${esc(img?'img/'+img:'')}" data-desc="${esc(s)}" data-src="${esc(src)}" data-dt="${esc(dt)}" data-cat="${esc(cat)}"`;
 return `<div class="row ${cls}" id="${V}-s${id}">${img?`<img class="th" src="../img/${img}" alt="" loading="lazy">`:`<div class="ph">no image</div>`}<div class="tx"><b><span class="n">${n}.</span>${esc(t)}</b><p>${esc(s)}</p><a href="${url}" target="_blank" rel="noopener">${esc(src)}</a> <span class="dt">· ${dt}</span></div>${votes('story',id,t,x)}</div>`};
function renderCats(DATA,V){let h='';
for(const c of DATA){const cid=slug(c.cat);
 // group top 5: round-robin of each subgroup's ranked items
 const top=[];for(let r=0;top.length<5&&r<10;r++)for(const s of c.subs){if(s.items[r]&&top.length<5)top.push(s.items[r])}
 h+=`<section id="${V}-${cid}"><div class="ch"><span class="car">▾</span><h2>${esc(c.cat)}</h2>${votes('category',cid,c.cat)}</div><div class="body">`;
 if(!(c.subs.length===1&&!c.subs[0].sub))h+=`<div class="top"><h4>Top 5</h4><ol>${top.map(it=>`<li><a href="#${V}-s${it[7]}">${esc(it[1])}</a></li>`).join('')}</ol></div>`;
 for(const s of c.subs){if(!s.items.length)continue;const sid=cid+'/'+slug(s.sub);
  h+=`<div class="sub">`+(s.sub?`<div class="sh"><span class="t">${esc(s.sub)}</span>${votes('subcategory',sid,c.cat+' › '+s.sub)}</div>`:'');
  s.items.slice(0,10).forEach((it,i)=>h+=row(it,i>=5?'more':'',V,c.cat+(s.sub?' › '+s.sub:'')));
  if(s.items.length>5)h+=`<button class="mt">…more (${Math.min(10,s.items.length)-5})</button>`;
  h+=`</div>`;}
 h+=`</div></section>`;}
return h}
let VIEWS=Array.isArray(DATA)?[['all','',DATA]]:DATA.views;
let html='';if(VIEWS.length>1)html+=`<div class="tog">${VIEWS.map((v,i)=>`<button data-v="${v[0]}" class="${i?'':'on'}">${esc(v[1])}</button>`).join('')}</div>`;
VIEWS.forEach((v,i)=>html+=`<div class="view" data-v="${v[0]}" ${i?'hidden':''}>${renderCats(v[2],v[0])}</div>`);
document.getElementById('m').innerHTML=html;
document.querySelectorAll('.tog button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tog button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.view').forEach(v=>v.hidden=v.dataset.v!==b.dataset.v);try{localStorage.setItem('view:'+FEED,b.dataset.v)}catch(e){}}));
{const pv=localStorage.getItem('view:'+FEED);const pb=pv&&document.querySelector(`.tog button[data-v="${pv}"]`);if(pb)pb.click();}

document.querySelectorAll('.ch').forEach(e=>e.addEventListener('click',ev=>{if(ev.target.closest('.v'))return;e.parentElement.classList.toggle('closed')}));
document.querySelectorAll('.mt').forEach(b=>b.addEventListener('click',()=>{const s=b.parentElement;s.classList.toggle('open');b.textContent=s.classList.contains('open')?'less':`…more (${s.querySelectorAll('.more').length})`}));
const key=(l,i)=>`fb:${FEED}:${DATE}:${l}:${i}`;
// shared cross-day like store (same origin): likes:v1 = {id:{...story, ts}}; likes:unliked = {id:ts}
const LK='likes:v1',UK='likes:unliked',lget=k=>{try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return {}}},lset=(k,o)=>localStorage.setItem(k,JSON.stringify(o));
function likeSync(v,on){if(v.dataset.level!=='story')return;const L=lget(LK),U=lget(UK),d=v.dataset,id=d.id;
 if(on){if(!L[id])L[id]={id,title:d.title,url:d.url,img:d.img,desc:d.desc,source:d.src,date:DATE,dt:d.dt,feed:FEED,feedname:FEEDNAME,cat:d.cat,ts:Date.now()};delete U[id]}
 else{delete L[id];U[id]=Date.now()}
 lset(LK,L);lset(UK,U)}
document.querySelectorAll('.v').forEach(v=>{const {level,id,title}=v.dataset;const st=localStorage.getItem(key(level,id));
 if(st)v.querySelectorAll(`[data-d="${st}"]`).forEach(b=>b.classList.add('on'));
 if(st==='up'&&level==='story'&&!lget(LK)[id])likeSync(v,true); // backfill likes made before the store existed
 v.querySelectorAll('button').forEach(b=>b.addEventListener('click',async ev=>{ev.stopPropagation();
  const was=b.classList.contains('on');const vote=was?'clear':b.dataset.d;
  document.querySelectorAll(`.v[data-level="${level}"][data-id="${id}"]`).forEach(w=>w.querySelectorAll('button').forEach(x=>x.classList.toggle('on',!was&&x.dataset.d===vote)));
  was?localStorage.removeItem(key(level,id)):localStorage.setItem(key(level,id),vote);
  if(level==='story')likeSync(v,vote==='up');
  // mirror state on duplicate controls (none currently)
  try{await fetch('feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({feed:FEED,date:DATE,level,id,title,vote})})}catch(e){}
 }))});
const icon={up:'👍',neutral:'●',down:'👎'};
document.getElementById('send').addEventListener('click',()=>{const lines=[],seen=new Set();
 document.querySelectorAll('.v').forEach(v=>{const k=key(v.dataset.level,v.dataset.id);if(seen.has(k))return;seen.add(k);const s=localStorage.getItem(k);if(s)lines.push(`${icon[s]} ${s} | ${v.dataset.level} ${v.dataset.id}: ${v.dataset.title}`)});
 if(!lines.length){alert('No votes yet.');return}
 const body=`feed: ${FEEDNAME}\ndate: ${DATE}\n\n`+lines.join('\n');
 if(!REPO||REPO.startsWith('__')){navigator.clipboard&&navigator.clipboard.writeText(body);alert('Feedback copied to clipboard:\n\n'+body);return}
 window.open(`https://github.com/${REPO}/issues/new?title=${encodeURIComponent((FEED==='news'?'Global News':'SciTech')+' feedback '+DATE)}&body=${encodeURIComponent(body)}`,'_blank');});
</script></body></html>
