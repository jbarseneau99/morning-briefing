.v button:hover{opacity:1}.v button.on.up{background:var(--up);border-color:var(--up);opacity:1}.v button.on.dn{background:var(--dn);border-color:var(--dn);opacity:1}

, DATE='2026-10-07', REPO='OWNER/morning-briefing';
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function votes(level,id,title){return `<span class="v" data-level="${level}" data-id="${id}" data-title="${esc(title)}"><button class="up" title="More like this">👍</button><button class="dn" title="Less like this">👎</button></span>`}
let h='';
for(const c of DATA){const cid=slug(c.cat);
 h+=`<section id="${cid}"><div class="ch"><span class="car">▾</span><h2>${esc(c.cat)}</h2>${votes('category',cid,c.cat)}</div><div class="body">`;
 for(const it of c.items){ if(it.length===1){h+=`<div class="sub">${esc(it[0])}</div>`;continue}
  const [n,t,s,src,url,dt,img]=it;
  h+=`<div class="row">${img?`<img class="th" src="img/${img}" alt="" loading="lazy">`:`<div class="ph">no image</div>`}<div class="tx"><b><span class="n">${n}.</span>${esc(t)}</b><p>${esc(s)}</p><a href="${url}" target="_blank" rel="noopener">${esc(src)}</a> <span class="dt">· ${dt}</span></div>${votes('story',String(n).padStart(2,'0'),t)}</div>`;}
 h+=`</div></section>`;}
document.getElementById('m').innerHTML=h;
document.querySelectorAll('.ch').forEach(e=>e.addEventListener('click',ev=>{if(ev.target.closest('.v'))return;e.parentElement.classList.toggle('closed')}));
const key=(l,i)=>`fb:${DATE}:${l}:${i}`;
document.querySelectorAll('.v').forEach(v=>{const {level,id,title}=v.dataset;const st=localStorage.getItem(key(level,id));
 if(st)v.querySelector('.'+st).classList.add('on');
 v.querySelectorAll('button').forEach(b=>b.addEventListener('click',async ev=>{ev.stopPropagation();
  const dir=b.classList.contains('up')?'up':'dn';const was=b.classList.contains('on');
  v.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
  const vote=was?'clear':(dir==='up'?'up':'down'); if(!was)b.classList.add('on');
  was?localStorage.removeItem(key(level,id)):localStorage.setItem(key(level,id),dir);
  try{await fetch('/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:DATE,level,id,title,vote})})}catch(e){console.warn(e)}
 }))});

document.getElementById('send').addEventListener('click',()=>{const lines=[];
 document.querySelectorAll('.v').forEach(v=>{const s=localStorage.getItem(key(v.dataset.level,v.dataset.id));if(s)lines.push(`${s==='up'?'👍':'👎'} ${v.dataset.level} ${v.dataset.id}: ${v.dataset.title}`)});
 if(!lines.length){alert('No votes yet.');return}
 const body=`date: ${DATE}\n\n`+lines.join('\n');
 if(!REPO||REPO.startsWith('__')){navigator.clipboard&&navigator.clipboard.writeText(body);alert('Feedback copied to clipboard:\n\n'+body);return}
 window.open(`https://github.com/${REPO}/issues/new?title=${encodeURIComponent('Feedback '+DATE)}&body=${encodeURIComponent(body)}`,'_blank');});
