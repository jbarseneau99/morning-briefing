], DATE='2026-10-07', REPO='jbarseneau99/morning-briefing';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug=s=>s.toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const votes=(level,id,title)=>`<span class="v" data-level="${level}" data-id="${id}" data-title="${esc(title)}"><button class="up" data-d="up" title="More like this">👍</button><button class="ne" data-d="neutral" title="Neutral">●</button><button class="dn" data-d="down" title="Less like this">👎</button></span>`;
const row=(it,cls='')=>{const [n,t,s,src,url,dt,img]=it;const id=String(n).padStart(3,'0');
 return `<div class="row ${cls}" id="s${id}">${img?`<img class="th" src="img/${img}" alt="" loading="lazy">`:`<div class="ph">no image</div>`}<div class="tx"><b><span class="n">${n}.</span>${esc(t)}</b><p>${esc(s)}</p><a href="${url}" target="_blank" rel="noopener">${esc(src)}</a> <span class="dt">· ${dt}</span></div>${votes('story',id,t)}</div>`};
let h='';
for(const c of DATA){const cid=slug(c.cat);
 // group top 5: round-robin of each subgroup's ranked items
 const top=[];for(let r=0;top.length<5&&r<10;r++)for(const s of c.subs){if(s.items[r]&&top.length<5)top.push(s.items[r])}
 h+=`<section id="${cid}"><div class="ch"><span class="car">▾</span><h2>${esc(c.cat)}</h2>${votes('category',cid,c.cat)}</div><div class="body">`;
 h+=`<div class="top"><h4>Top 5</h4><ol>${top.map(it=>`<li><a href="#s${String(it[0]).padStart(3,'0')}">${esc(it[1])}</a></li>`).join('')}</ol></div>`;
 for(const s of c.subs){if(!s.items.length)continue;const sid=cid+'/'+slug(s.sub);
  h+=`<div class="sub"><div class="sh"><span class="t">${esc(s.sub)}</span>${votes('subcategory',sid,c.cat+' › '+s.sub)}</div>`;
  s.items.slice(0,10).forEach((it,i)=>h+=row(it,i>=5?'more':''));
  if(s.items.length>5)h+=`<button class="mt">…more (${Math.min(10,s.items.length)-5})</button>`;
  h+=`</div>`;}
 h+=`</div></section>`;}
document.getElementById('m').innerHTML=h;
document.querySelectorAll('.ch').forEach(e=>e.addEventListener('click',ev=>{if(ev.target.closest('.v'))return;e.parentElement.classList.toggle('closed')}));
document.querySelectorAll('.mt').forEach(b=>b.addEventListener('click',()=>{const s=b.parentElement;s.classList.toggle('open');b.textContent=s.classList.contains('open')?'less':`…more (${s.querySelectorAll('.more').length})`}));
const key=(l,i)=>`fb:${DATE}:${l}:${i}`;
document.querySelectorAll('.v').forEach(v=>{const {level,id,title}=v.dataset;const st=localStorage.getItem(key(level,id));
 if(st)v.querySelectorAll(`[data-d="${st}"]`).forEach(b=>b.classList.add('on'));
 v.querySelectorAll('button').forEach(b=>b.addEventListener('click',async ev=>{ev.stopPropagation();
  const was=b.classList.contains('on');v.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
  const vote=was?'clear':b.dataset.d; if(!was)b.classList.add('on');
  was?localStorage.removeItem(key(level,id)):localStorage.setItem(key(level,id),vote);
  // mirror state on duplicate controls (none currently)
  try{await fetch('feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:DATE,level,id,title,vote})})}catch(e){}
 }))});
const icon={up:'👍',neutral:'●',down:'👎'};
document.getElementById('send').addEventListener('click',()=>{const lines=[],seen=new Set();
 document.querySelectorAll('.v').forEach(v=>{const k=key(v.dataset.level,v.dataset.id);if(seen.has(k))return;seen.add(k);const s=localStorage.getItem(k);if(s)lines.push(`${icon[s]} ${s} | ${v.dataset.level} ${v.dataset.id}: ${v.dataset.title}`)});
 if(!lines.length){alert('No votes yet.');return}
 const body=`date: ${DATE}\n\n`+lines.join('\n');
 if(!REPO||REPO.startsWith('__')){navigator.clipboard&&navigator.clipboard.writeText(body);alert('Feedback copied to clipboard:\n\n'+body);return}
 window.open(`https://github.com/${REPO}/issues/new?title=${encodeURIComponent('Feedback '+DATE)}&body=${encodeURIComponent(body)}`,'_blank');});
</script></body></html>
